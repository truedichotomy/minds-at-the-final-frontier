name: Publish to GitHub Pages

# Renders both editions (HTML + PDF) and deploys them to GitHub Pages on every
# push to main. The PDF is published alongside the HTML so the "Other Formats"
# download link on the site resolves. The PDF target needs a LaTeX toolchain
# (TinyTeX) and an SVG rasteriser (librsvg) to embed the figure SVGs, both
# installed below; expect builds of ~2-3 min.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight deployment at a time; newer pushes supersede older runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto (with TinyTeX for the PDF target)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install SVG rasteriser (embeds figure SVGs into the PDF)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render HTML + PDF
        run: quarto render

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API on first run so no manual dashboard step is
          # needed (also makes the repo reproducible on forks/clones). Requires
          # the `pages: write` permission granted above.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Must match `output-dir` in _quarto.yml.
          path: _output

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
